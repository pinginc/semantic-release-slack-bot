version: 2.1
parameters:
  executor-tag:
    type: string
    default: lts-browsers
    description: |
      Pick a specific circleci/node image variant: https://hub.docker.com/r/cimg/node/tags
jobs:
  migrated-to-github-actions:
    type: no-op
workflows:
  developer-branch:
    when:
      not:
        equal:
          - << pipeline.git.branch >>
          - main
    jobs:
      - migrated-to-github-actions
  main-branch:
    when:
      equal:
        - << pipeline.git.branch >>
        - main
    jobs:
      - migrated-to-github-actions
